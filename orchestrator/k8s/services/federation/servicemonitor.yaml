apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: basilica-federation
  namespace: basilica-federation
  labels:
    app: basilica-federation
spec:
  selector:
    matchLabels:
      app: basilica-federation
  endpoints:
  - port: metrics
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s

