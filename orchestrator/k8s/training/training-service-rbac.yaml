---
# RBAC configuration for the training session controller
apiVersion: v1
kind: ServiceAccount
metadata:
  name: training-controller
  namespace: basilica-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: training-controller
rules:
  # TrainingSession resources
  - apiGroups: ["basilica.ai"]
    resources: ["trainingsessions"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["basilica.ai"]
    resources: ["trainingsessions/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["basilica.ai"]
    resources: ["trainingsessions/finalizers"]
    verbs: ["update"]

  # Pods - create and manage training pods
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["get"]

  # Services - expose training pods
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Secrets - access storage credentials
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]

  # ConfigMaps - configuration
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]

  # Events - emit events
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]

  # Nodes - read node information for scheduling
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: training-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: training-controller
subjects:
  - kind: ServiceAccount
    name: training-controller
    namespace: basilica-system
