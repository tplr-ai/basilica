name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUSTFLAGS: "-Clink-arg=-fuse-ld=mold"
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: "clang"

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-{1}-{2}', github.workflow, github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  # Detect changes to determine which services need building
  changes:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    outputs:
      validator: ${{ steps.changes.outputs.validator }}
      miner: ${{ steps.changes.outputs.miner }}
      basilica-cli: ${{ steps.changes.outputs.basilica-cli }}
      basilica-sdk-python: ${{ steps.changes.outputs.basilica-sdk-python }}
      workspace: ${{ steps.changes.outputs.workspace }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dorny/paths-filter@4512585405083f25c027a35db413c2b3b9006d50 # v2
        id: changes
        with:
          # Pushes compare the pushed commit range. Pull requests ignore this
          # input and compare against their PR base.
          base: ${{ github.event_name == 'push' && github.ref || '' }}
          filters: .github/ci/path-filters.yml

  quick-checks:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install pinned Rust toolchain
        run: |
          rustup show
          rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: "shared-cache"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install protoc
        shell: bash
        run: |
          set -euo pipefail
          PROTOC_VERSION=25.9
          PROTOC_ZIP=protoc-${PROTOC_VERSION}-linux-x86_64.zip
          DOWNLOAD_URL=https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/${PROTOC_ZIP}
          for attempt in 1 2 3 4 5; do
            if curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors -o /tmp/${PROTOC_ZIP} "${DOWNLOAD_URL}"; then
              break
            fi
            if [ "${attempt}" = "5" ]; then
              echo "ERROR: protoc download failed after 5 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 10))
          done
          sudo unzip -q -o /tmp/${PROTOC_ZIP} -d /usr/local
          rm -f /tmp/${PROTOC_ZIP}
          protoc --version
      - name: Cache and install system dependencies
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # latest
        with:
          packages: pkg-config libssl-dev xxd mold clang python3-dev
          version: 1.0
      - name: Install cargo-nextest
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2
        with:
          tool: nextest
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check Rust toolchain consistency
        run: ./scripts/ci/check-rust-toolchain-consistency.sh
      - name: Check basilica-sdk-python version consistency
        # Guard: maturin uses pyproject.toml for the wheel version, while the
        # Rust crate reads Cargo.toml. When these drift, a tag-triggered
        # release can build wheels matching the pyproject version and get
        # silently skipped by PyPI's `skip-existing`.
        run: |
          set -euo pipefail
          cargo_ver=$(awk -F\" '/^version = / {print $2; exit}' crates/basilica-sdk-python/Cargo.toml)
          pyproject_ver=$(awk -F\" '/^version = / {print $2; exit}' crates/basilica-sdk-python/pyproject.toml)
          echo "Cargo.toml    version: $cargo_ver"
          echo "pyproject.toml version: $pyproject_ver"
          if [ "$cargo_ver" != "$pyproject_ver" ]; then
            echo "::error file=crates/basilica-sdk-python/pyproject.toml::basilica-sdk-python version drift: Cargo.toml=$cargo_ver, pyproject.toml=$pyproject_ver"
            exit 1
          fi
      - name: Quick check builds
        run: |
          cargo check --locked -p basilica-common -p basilica-protocol
      - name: Run clippy on core packages
        run: |
          cargo clippy --locked -p basilica-common -p basilica-protocol --all-targets -- -D warnings

  # Supply-chain checks: advisories, licenses, bans, sources.
  # Policy lives in `deny.toml`.
  security-audit:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: cargo deny check
        # Use the official cargo-deny-action: it installs cargo-deny and
        # manages the advisory-db fetch reliably. The direct `cargo deny`
        # install path fails on these runners because the advisory-db
        # metadata lookup does not handle a missing per-db directory.
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          # Respect `all-features = false` in deny.toml; the action default
          # of `--all-features` would otherwise override it.
          arguments: ""

  semgrep:
    name: Semgrep SAST
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/semgrep.yml

  secret-scan:
    name: Secret Scan
    permissions:
      contents: read
    uses: ./.github/workflows/gitleaks.yml

  lint-complex:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    needs: quick-checks
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install pinned Rust toolchain
        run: |
          rustup show
          rustup component add clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: "shared-cache"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install protoc
        shell: bash
        run: |
          set -euo pipefail
          PROTOC_VERSION=25.9
          PROTOC_ZIP=protoc-${PROTOC_VERSION}-linux-x86_64.zip
          DOWNLOAD_URL=https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/${PROTOC_ZIP}
          for attempt in 1 2 3 4 5; do
            if curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors -o /tmp/${PROTOC_ZIP} "${DOWNLOAD_URL}"; then
              break
            fi
            if [ "${attempt}" = "5" ]; then
              echo "ERROR: protoc download failed after 5 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 10))
          done
          sudo unzip -q -o /tmp/${PROTOC_ZIP} -d /usr/local
          rm -f /tmp/${PROTOC_ZIP}
          protoc --version
      - name: Cache and install system dependencies
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # latest
        with:
          packages: pkg-config libssl-dev xxd mold clang python3-dev
          version: 1.0
      - name: Install cargo-nextest
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2
        with:
          tool: nextest
      - name: Run clippy on complex packages
        run: |
          cargo clippy --locked -p basilica-miner --all-targets --all-features -- -D warnings
          cargo clippy --locked -p basilica-validator --all-targets --all-features -- -D warnings
          cargo clippy --locked -p basilica-cli --all-targets --all-features -- -D warnings
          cargo clippy --locked -p basilica-sdk --all-targets --all-features -- -D warnings

  # Build and test validator
  build-validator:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    needs: changes
    if: needs.changes.outputs.validator == 'true' || needs.changes.outputs.workspace == 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: "shared-cache"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install protoc
        shell: bash
        run: |
          set -euo pipefail
          PROTOC_VERSION=25.9
          PROTOC_ZIP=protoc-${PROTOC_VERSION}-linux-x86_64.zip
          DOWNLOAD_URL=https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/${PROTOC_ZIP}
          for attempt in 1 2 3 4 5; do
            if curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors -o /tmp/${PROTOC_ZIP} "${DOWNLOAD_URL}"; then
              break
            fi
            if [ "${attempt}" = "5" ]; then
              echo "ERROR: protoc download failed after 5 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 10))
          done
          sudo unzip -q -o /tmp/${PROTOC_ZIP} -d /usr/local
          rm -f /tmp/${PROTOC_ZIP}
          protoc --version
      - name: Cache and install system dependencies
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # latest
        with:
          packages: pkg-config libssl-dev xxd mold clang
          version: 1.0
      - name: Install cargo-nextest
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2
        with:
          tool: nextest
      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@ac083cc84672d01c60d5e8561d0a939b697de542 # v1
      - name: Generate test key
        run: |
          chmod +x scripts/gen-key.sh
          ./scripts/gen-key.sh
      - name: Build and test validator
        run: |
          export VALIDATOR_PUBLIC_KEY=$(cat public_key.hex)
          cargo build --locked -p basilica-validator
          cargo nextest run --locked -p basilica-validator --all-features --no-fail-fast
          ./target/debug/basilica-validator --help
      - name: Clean up space before Docker build
        run: |
          docker system prune -af
          df -h
      - name: Test Docker build script
        run: |
          chmod +x scripts/validator/build.sh
          BITTENSOR_NETWORK=finney ./scripts/validator/build.sh --no-extract
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IGNOREFILE: .trivyignore.yaml
        with:
          image-ref: basilica/validator:latest
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  # Build and test miner
  build-miner:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    needs: changes
    if: needs.changes.outputs.miner == 'true' || needs.changes.outputs.workspace == 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: "shared-cache"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install protoc
        shell: bash
        run: |
          set -euo pipefail
          PROTOC_VERSION=25.9
          PROTOC_ZIP=protoc-${PROTOC_VERSION}-linux-x86_64.zip
          DOWNLOAD_URL=https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/${PROTOC_ZIP}
          for attempt in 1 2 3 4 5; do
            if curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors -o /tmp/${PROTOC_ZIP} "${DOWNLOAD_URL}"; then
              break
            fi
            if [ "${attempt}" = "5" ]; then
              echo "ERROR: protoc download failed after 5 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 10))
          done
          sudo unzip -q -o /tmp/${PROTOC_ZIP} -d /usr/local
          rm -f /tmp/${PROTOC_ZIP}
          protoc --version
      - name: Cache and install system dependencies
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # latest
        with:
          packages: pkg-config libssl-dev xxd mold clang python3-dev
          version: 1.0
      - name: Install cargo-nextest
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2
        with:
          tool: nextest
      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@ac083cc84672d01c60d5e8561d0a939b697de542 # v1
      - name: Generate test key
        run: |
          chmod +x scripts/gen-key.sh
          ./scripts/gen-key.sh
      - name: Build and test miner
        run: |
          export VALIDATOR_PUBLIC_KEY=$(cat public_key.hex)
          cargo build --locked -p basilica-miner
          cargo nextest run --locked -p basilica-miner --lib --no-fail-fast
          ./target/debug/basilica-miner --help
      - name: Clean up space before Docker build
        run: |
          docker system prune -af
          df -h
      - name: Test Docker build script
        run: |
          chmod +x scripts/miner/build.sh
          BITTENSOR_NETWORK=finney ./scripts/miner/build.sh --no-extract
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IGNOREFILE: .trivyignore.yaml
        with:
          image-ref: basilica/miner:latest
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  # Build and test basilica-cli
  build-cli:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    needs: changes
    if: needs.changes.outputs.basilica-cli == 'true' || needs.changes.outputs.workspace == 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: "shared-cache"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install protoc
        shell: bash
        run: |
          set -euo pipefail
          PROTOC_VERSION=25.9
          PROTOC_ZIP=protoc-${PROTOC_VERSION}-linux-x86_64.zip
          DOWNLOAD_URL=https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/${PROTOC_ZIP}
          for attempt in 1 2 3 4 5; do
            if curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors -o /tmp/${PROTOC_ZIP} "${DOWNLOAD_URL}"; then
              break
            fi
            if [ "${attempt}" = "5" ]; then
              echo "ERROR: protoc download failed after 5 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 10))
          done
          sudo unzip -q -o /tmp/${PROTOC_ZIP} -d /usr/local
          rm -f /tmp/${PROTOC_ZIP}
          protoc --version
      - name: Cache and install system dependencies
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # latest
        with:
          packages: pkg-config libssl-dev xxd mold clang python3-dev
          version: 1.0
      - name: Install cargo-nextest
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2
        with:
          tool: nextest
      - name: Build and test basilica-cli
        run: |
          cargo build --locked -p basilica-cli
          cargo nextest run --locked -p basilica-cli --all-features --no-fail-fast
          ./target/debug/basilica --help

  # Build and test Python SDK
  test-python-sdk:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    needs: changes
    if: needs.changes.outputs.basilica-sdk-python == 'true' || needs.changes.outputs.workspace == 'true'
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          working-directory: crates/basilica-sdk-python

      - name: Install pinned Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: "shared-cache"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install protoc
        shell: bash
        run: |
          set -euo pipefail
          PROTOC_VERSION=25.9
          PROTOC_ZIP=protoc-${PROTOC_VERSION}-linux-x86_64.zip
          DOWNLOAD_URL=https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/${PROTOC_ZIP}
          for attempt in 1 2 3 4 5; do
            if curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors -o /tmp/${PROTOC_ZIP} "${DOWNLOAD_URL}"; then
              break
            fi
            if [ "${attempt}" = "5" ]; then
              echo "ERROR: protoc download failed after 5 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 10))
          done
          sudo unzip -q -o /tmp/${PROTOC_ZIP} -d /usr/local
          rm -f /tmp/${PROTOC_ZIP}
          protoc --version

      - name: Cache and install system dependencies
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # latest
        with:
          packages: pkg-config libssl-dev xxd mold clang python3-dev
          version: 1.0

      - name: Install locked Python dependencies
        working-directory: crates/basilica-sdk-python
        run: uv sync --locked --extra dev --no-install-project

      - name: Run Python SDK clippy
        if: matrix.python-version == '3.12'
        run: |
          rustup component add clippy
          cargo clippy --locked -p basilica-sdk-python --all-targets -- -D warnings

      - name: Build and install Python SDK
        working-directory: crates/basilica-sdk-python
        run: uv run --no-sync maturin develop --release --locked

      - name: Run Python tests
        working-directory: crates/basilica-sdk-python
        # Live tests require external credentials and may create chargeable
        # deployments. Keep normal CI limited to hermetic unit/regression tests.
        run: |
          uv run --no-sync python -m pytest tests/ -v \
            --ignore=tests/test_dns_propagation_e2e.py \
            --ignore=tests/test_gpu_flavour_preferences.py

      - name: Audit Python dependencies
        if: matrix.python-version == '3.12'
        working-directory: crates/basilica-sdk-python
        run: uv run --no-sync pip-audit --local

      - name: Test examples (syntax check)
        working-directory: crates/basilica-sdk-python
        run: |
          for example in examples/*.py; do
            echo "Checking $example..."
            uv run --no-sync python -m py_compile "$example"
          done

      - name: Test import
        working-directory: crates/basilica-sdk-python
        run: |
          uv run --no-sync python -c 'import basilica; print(f"SDK imported successfully. API URL: {basilica.DEFAULT_API_URL}")'

  # Final status check
  ci-success:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    needs:
      - changes
      - quick-checks
      - lint-complex
      - security-audit
      - semgrep
      - secret-scan
      - build-validator
      - build-miner
      - build-cli
      - test-python-sdk
    if: ${{ !cancelled() }}
    steps:
      - name: Check if all jobs succeeded
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          WORKSPACE_SELECTED: ${{ needs.changes.outputs.workspace }}
          VALIDATOR_SELECTED: ${{ needs.changes.outputs.validator }}
          VALIDATOR_RESULT: ${{ needs.build-validator.result }}
          MINER_SELECTED: ${{ needs.changes.outputs.miner }}
          MINER_RESULT: ${{ needs.build-miner.result }}
          CLI_SELECTED: ${{ needs.changes.outputs['basilica-cli'] }}
          CLI_RESULT: ${{ needs.build-cli.result }}
          PYTHON_SELECTED: ${{ needs.changes.outputs['basilica-sdk-python'] }}
          PYTHON_RESULT: ${{ needs.test-python-sdk.result }}
          QUICK_CHECKS_RESULT: ${{ needs.quick-checks.result }}
          LINT_COMPLEX_RESULT: ${{ needs.lint-complex.result }}
          SECURITY_AUDIT_RESULT: ${{ needs.security-audit.result }}
          SEMGREP_RESULT: ${{ needs.semgrep.result }}
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
        run: |
          set -euo pipefail

          require_success() {
            local job_name="$1"
            local result="$2"
            if [[ "$result" != "success" ]]; then
              echo "::error::$job_name returned '$result'; expected 'success'"
              return 1
            fi
          }

          require_selector() {
            local selector_name="$1"
            local value="$2"
            if [[ "$value" != "true" && "$value" != "false" ]]; then
              echo "::error::$selector_name has malformed or missing value '$value'"
              return 1
            fi
          }

          require_lane_result() {
            local lane_name="$1"
            local selected="$2"
            local result="$3"
            local expected="skipped"

            if [[ "$selected" == "true" || "$WORKSPACE_SELECTED" == "true" ]]; then
              expected="success"
            fi

            if [[ "$result" != "$expected" ]]; then
              echo "::error::$lane_name returned '$result'; expected '$expected'"
              return 1
            fi
          }

          require_success "changes" "$CHANGES_RESULT"
          require_success "quick-checks" "$QUICK_CHECKS_RESULT"
          require_success "lint-complex" "$LINT_COMPLEX_RESULT"
          require_success "security-audit" "$SECURITY_AUDIT_RESULT"
          require_success "semgrep" "$SEMGREP_RESULT"
          require_success "secret-scan" "$SECRET_SCAN_RESULT"

          require_selector "workspace selector" "$WORKSPACE_SELECTED"
          require_selector "validator selector" "$VALIDATOR_SELECTED"
          require_selector "miner selector" "$MINER_SELECTED"
          require_selector "CLI selector" "$CLI_SELECTED"
          require_selector "Python SDK selector" "$PYTHON_SELECTED"

          require_lane_result "build-validator" "$VALIDATOR_SELECTED" "$VALIDATOR_RESULT"
          require_lane_result "build-miner" "$MINER_SELECTED" "$MINER_RESULT"
          require_lane_result "build-cli" "$CLI_SELECTED" "$CLI_RESULT"
          require_lane_result "test-python-sdk" "$PYTHON_SELECTED" "$PYTHON_RESULT"

          echo "All CI checks passed!"
