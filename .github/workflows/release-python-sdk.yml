name: Release Python SDK

on:
  push:
    tags:
      - "basilica-sdk-python-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g., basilica-sdk-python-v0.1.0)"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  id-token: write  # Required for trusted publishing to PyPI

jobs:
  extract-version:
    name: Extract version from tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.tag }}"
            if [[ ! "$TAG" =~ ^basilica-sdk-python-v ]]; then
              echo "Error: Tag must start with 'basilica-sdk-python-v' prefix"
              echo "Example: basilica-sdk-python-v0.1.0"
              exit 1
            fi
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#basilica-sdk-python-v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Releasing Python SDK version: $VERSION"

  build-wheels-linux:
    name: Build wheels on Linux (${{ matrix.target }})
    needs: extract-version
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: x86_64
            runner: ubuntu-latest
            protoc_arch: linux-x86_64
          - target: aarch64
            runner: ubuntu-24.04-arm
            protoc_arch: linux-aarch_64
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist -i python3.10 --manifest-path crates/basilica-sdk-python/Cargo.toml
          rust-toolchain: "1.97.1"
          sccache: 'true'
          manylinux: auto
          before-script-linux: |
            # Install protoc inside the manylinux container
            curl -LO "https://github.com/protocolbuffers/protobuf/releases/download/v25.1/protoc-25.1-${{ matrix.protoc_arch }}.zip"
            python3 -c "import zipfile; zipfile.ZipFile('protoc-25.1-${{ matrix.protoc_arch }}.zip').extractall('/usr/local')"
            chmod +x /usr/local/bin/protoc
            protoc --version

      - name: Upload wheels
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist/*.whl

  build-wheels-macos:
    name: Build wheels on macOS (${{ matrix.target }})
    needs: extract-version
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'

      - name: Install protoc
        run: brew install protobuf

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist --manifest-path crates/basilica-sdk-python/Cargo.toml
          rust-toolchain: "1.97.1"
          sccache: 'true'

      - name: Upload wheels
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist/*.whl

  build-sdist:
    name: Build source distribution
    needs: extract-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'

      - name: Install protoc
        shell: bash
        run: |
          set -euo pipefail
          PROTOC_VERSION=25.9
          PROTOC_ZIP=protoc-${PROTOC_VERSION}-linux-x86_64.zip
          DOWNLOAD_URL=https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/${PROTOC_ZIP}
          for attempt in 1 2 3 4 5; do
            if curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors -o /tmp/${PROTOC_ZIP} "${DOWNLOAD_URL}"; then
              break
            fi
            if [ "${attempt}" = "5" ]; then
              echo "ERROR: protoc download failed after 5 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 10))
          done
          sudo unzip -q -o /tmp/${PROTOC_ZIP} -d /usr/local
          rm -f /tmp/${PROTOC_ZIP}
          protoc --version

      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          args: --out dist --manifest-path crates/basilica-sdk-python/Cargo.toml
          rust-toolchain: "1.97.1"

      - name: Upload sdist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish-to-pypi:
    name: Publish to PyPI
    needs: [extract-version, build-wheels-linux, build-wheels-macos, build-sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # Required for trusted publishing
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Download sdist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sdist
          path: dist

      - name: List distributions
        run: |
          ls -lh dist/
          echo "Total files to upload: $(ls -1 dist/ | wc -l)"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          skip-existing: true
          print-hash: true

  create-github-release:
    name: Create GitHub Release
    needs: [extract-version, publish-to-pypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download all wheel artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Download sdist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sdist
          path: dist

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.extract-version.outputs.tag }}
          name: Basilica Python SDK v${{ needs.extract-version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            # Basilica Python SDK v${{ needs.extract-version.outputs.version }}

            ## Installation

            ```bash
            pip install basilica-sdk==${{ needs.extract-version.outputs.version }}
            ```

            ## Quick Start

            ```python
            import basilica

            # Client auto-detects BASILICA_API_TOKEN environment variable
            client = basilica.BasilicaClient()

            # Check the API connection
            health = client.health_check()
            print(f"API status: {health.status}")

            # List current secure-cloud GPU offerings
            offerings = client.list_secure_cloud_gpus()
            for offering in offerings[:5]:
                print(
                    f"{offering.gpu_count}x {offering.gpu_type} "
                    f"@ ${offering.hourly_rate}/hr ({offering.provider})"
                )
            ```

            ## Documentation

            - [Python SDK Documentation](https://docs.basilica.ai/python-sdk)
            - [API Reference](https://docs.basilica.ai/api)
            - [Examples](https://github.com/one-covenant/basilica/tree/main/crates/basilica-sdk-python/examples)
            - [Changelog](https://github.com/one-covenant/basilica/blob/main/crates/basilica-sdk-python/CHANGELOG.md)

            ## PyPI Package

            https://pypi.org/project/basilica-sdk/${{ needs.extract-version.outputs.version }}/

            ## Supported Platforms

            - Linux: x86_64, aarch64 (ARM64)
            - macOS: x86_64 (Intel), aarch64 (Apple Silicon)
            - Python: 3.10, 3.11, 3.12, 3.13

            Note: Windows is not supported as Basilica requires Unix/Linux infrastructure (K3s, SSH, process management).

            ## What's Changed

            See [CHANGELOG.md](https://github.com/one-covenant/basilica/blob/main/crates/basilica-sdk-python/CHANGELOG.md) for detailed changes.
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
