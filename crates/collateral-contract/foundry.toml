[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
evm_version = "cancun"
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/"
]

# RPC endpoints for different networks
[rpc_endpoints]
# Local testnet (your custom EVM)
local = "http://localhost:9944"

[lint]
exclude_lints = ["asm-keccak256"]

[profile.local]
evm_version = "london"
optimizer = true
optimizer_runs = 200
