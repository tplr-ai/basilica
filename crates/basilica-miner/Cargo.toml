[package]
name = "basilica-miner"
version = "0.1.0"
edition = "2021"
authors = ["Basilica Team <team@basilica.ai>"]
description = "Basilica Miner - Bittensor neuron that manages GPU node fleets"
license = "MIT"
repository = "https://github.com/one-covenant/basilica"
homepage = "https://basilica.ai"
documentation = "https://docs.rs/basilica-miner"
readme = "README.md"
keywords = ["bittensor", "miner", "gpu", "compute", "blockchain"]
categories = ["network-programming", "asynchronous"]
rust-version = "1.70"
include = ["src/**/*", "migrations/**/*", "README.md", "LICENSE", "CHANGELOG.md"]

[lib]
name = "basilica_miner"
path = "src/lib.rs"

[[bin]]
name = "basilica-miner"
path = "src/main.rs"

[dependencies]
# Workspace dependencies
tokio = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true }
tracing = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
sqlx = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
tonic-health = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
blake3 = { workspace = true }
clap = { workspace = true }
clap-verbosity-flag = { workspace = true }
alloy = { workspace = true }
alloy-primitives = { workspace = true }
alloy-provider = { workspace = true }
alloy-sol-types = { workspace = true }
collateral-contract = { version = "0.1", path = "../collateral-contract" }
hex = { workspace = true }

# Internal dependencies
basilica-common = { version = "0.1", path = "../basilica-common", features = ["sqlite"] }
basilica-protocol = { version = "0.1", path = "../basilica-protocol" }
bittensor = { workspace = true }

# Miner-specific dependencies
# Configuration
toml = { workspace = true }

# Background job processing
async-trait = { workspace = true }

# Random number generation
rand = { workspace = true }

# SSH key parsing
ssh-key = { workspace = true }

[features]
default = []
