[package]
name = "basilica-aggregator"
version = "0.1.0"
edition = "2021"
authors = ["Basilica Team <team@basilica.ai>"]
description = "Price aggregation and billing utilities for Basilica GPU marketplace"
license = "MIT"
repository = "https://github.com/one-covenant/basilica"
homepage = "https://basilica.ai"
documentation = "https://docs.rs/basilica-aggregator"
readme = "README.md"
keywords = ["bittensor", "billing", "aggregation", "gpu", "compute"]
categories = ["network-programming", "asynchronous"]
rust-version = "1.70"
include = ["src/**/*", "README.md", "LICENSE", "CHANGELOG.md"]

[dependencies]
# Basilica dependencies
basilica-common = { version = "0.1", path = "../basilica-common" }
basilica-billing = { version = "0.1", path = "../basilica-billing" }
basilica-protocol = { version = "0.1", path = "../basilica-protocol" }

# Protobuf types (for billing timestamps)
prost-types = { workspace = true }

# Async runtime
tokio = { workspace = true }

# HTTP client
reqwest = { workspace = true }

# Database (PostgreSQL only)
sqlx = { workspace = true, features = ["macros"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Decimal precision for prices
rust_decimal = { workspace = true, features = ["serde-with-str"] }

# Configuration
config = "0.14"

# Time handling
chrono = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Async trait support
async-trait = { workspace = true }

# UUID generation
uuid = { workspace = true }

# CSV parsing
csv = "1.3"

# AWS SDK for S3 (VIP machine inventory)
aws-config = "1.1"
aws-sdk-s3 = "1.15"

[dev-dependencies]
mockito = "1"
toml = { workspace = true }
