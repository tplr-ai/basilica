[package]
name = "basilica-autoscaler"
version = "0.1.0"
edition = "2021"
authors = ["Basilica Team <team@basilica.ai>"]
description = "Basilica GPU node autoscaler: dynamic scaling of K3s GPU nodes"
license = "MIT"
repository = "https://github.com/one-covenant/basilica"
homepage = "https://basilica.ai"
documentation = "https://docs.rs/basilica-autoscaler"
readme = "README.md"
keywords = ["kubernetes", "autoscaling", "gpu", "k3s", "compute"]
categories = ["network-programming", "asynchronous"]
rust-version = "1.70"
include = ["src/**/*", "README.md", "LICENSE", "CHANGELOG.md"]

[[bin]]
name = "basilica-autoscaler"
path = "src/main.rs"

[[bin]]
name = "crdgen"
path = "src/bin/crdgen.rs"

[dependencies]
# Workspace dependencies
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
tracing-subscriber = { workspace = true }
axum = { workspace = true }

# Kubernetes
kube = { version = "0.88", features = ["derive", "rustls-tls"] }
kube-runtime = "0.88"
k8s-openapi = { version = "0.21", default-features = false, features = ["v1_29"] }
schemars = { version = "0.8", features = ["chrono"] }
prometheus = "0.13"
tokio-util = { version = "0.7", features = ["rt"] }

# Internal crate
basilica-common = { version = "0.1", path = "../basilica-common" }

# Temp file for SSH key management
tempfile = { workspace = true }

# YAML for script templates
serde_yaml = "0.9"

# Crypto and encoding (from workspace)
sha2 = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
mockall = "0.12"
tokio-test = "0.4"
tower = { workspace = true }
