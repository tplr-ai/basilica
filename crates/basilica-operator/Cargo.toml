[package]
name = "basilica-operator"
version = "0.1.0"
edition = "2021"
authors = ["Basilica Team <team@basilica.ai>"]
description = "Basilica Kubernetes operator: CRDs and controllers for GPU workload orchestration"
license = "MIT"
repository = "https://github.com/one-covenant/basilica"
homepage = "https://basilica.ai"
documentation = "https://docs.rs/basilica-operator"
readme = "README.md"
keywords = ["kubernetes", "operator", "gpu", "k3s", "crd"]
categories = ["network-programming", "asynchronous"]
rust-version = "1.70"
include = ["src/**/*", "README.md", "LICENSE", "CHANGELOG.md"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
kube = { version = "0.88", features = ["derive", "rustls-tls"] }
schemars = "0.8"
k8s-openapi = { version = "0.21", default-features = false, features = ["v1_29"] }
async-trait = "0.1"
metrics = { workspace = true }
serde_yaml = "0.9"
kube-runtime = "0.88"
metrics-exporter-prometheus = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "json"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
futures = "0.3"
axum = { version = "0.7", default-features = false, features = ["json", "tokio", "http1"] }
chrono = { version = "0.4", features = ["serde"] }
shlex = "1.3"
governor = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
serde_json = { workspace = true }
kube = { version = "0.88", features = ["derive", "rustls-tls"] }
schemars = "0.8"
k8s-openapi = { version = "0.21", features = ["v1_29"] }
metrics-exporter-prometheus = { workspace = true }
