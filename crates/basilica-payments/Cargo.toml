[package]
name = "basilica-payments"
version = "0.1.0"
edition = "2021"
authors = ["Basilica Team <team@basilica.ai>"]
description = "Payment processing service for Basilica GPU marketplace with TAO integration"
license = "MIT"
repository = "https://github.com/one-covenant/basilica"
homepage = "https://basilica.ai"
documentation = "https://docs.rs/basilica-payments"
readme = "README.md"
keywords = ["bittensor", "payments", "gpu", "tao", "blockchain"]
categories = ["network-programming", "cryptography"]
rust-version = "1.70"
include = ["src/**/*", "migrations/**/*", "README.md", "LICENSE", "CHANGELOG.md"]

[[bin]]
name = "basilica-payments"
path = "src/main.rs"

[[bin]]
name = "paymentsctl"
path = "src/bin/paymentsctl.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
tonic-health = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
clap-verbosity-flag = { workspace = true }
figment = { workspace = true }
toml = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
chrono = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
sp-core = { workspace = true }
hex = { workspace = true }
subxt = { workspace = true }
subxt-signer = { workspace = true }
zeroize = { workspace = true }

[dependencies.basilica-protocol]
version = "0.1"
path = "../basilica-protocol"

[dependencies.basilica-common]
version = "0.1"
path = "../basilica-common"
features = ["postgres"]

[dependencies.bittensor]
workspace = true
