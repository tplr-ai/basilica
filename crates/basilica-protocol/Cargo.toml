[package]
name = "basilica-protocol"
version = "0.1.0"
edition = "2021"
authors = ["Basilica Team <team@basilica.ai>"]
description = "gRPC protocol definitions and message types for Basilica network communication"
license = "MIT"
repository = "https://github.com/one-covenant/basilica"
homepage = "https://basilica.ai"
documentation = "https://docs.rs/basilica-protocol"
readme = "README.md"
keywords = ["bittensor", "grpc", "protocol", "gpu", "compute"]
categories = ["network-programming", "api-bindings"]
rust-version = "1.70"
include = ["src/**/*", "proto/**/*", "build.rs", "README.md", "LICENSE", "CHANGELOG.md"]

[dependencies]
# Use workspace dependencies
basilica-common = { version = "0.1", path = "../basilica-common" }
tonic = { workspace = true, features = ["tls"] }
prost = { workspace = true }
prost-types = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[build-dependencies]
tonic-build = { workspace = true }

[features]
default = []
# Feature for client-side stubs
client = []
# Feature for server-side stubs  
server = [] 
