syntax = "proto3";

package basilica.stripe.v1;

import "google/protobuf/timestamp.proto";

// StripeService owns Stripe Checkout session creation and status lookups for
// the Basilica credit-purchase flow. The service is VPC-internal only —
// basilica-api authenticates the caller and forwards `caller_user_id` on
// every request; basilica-stripe enforces per-user scoping in SQL on read
// paths and returns NotFound (not PermissionDenied) for cross-tenant lookups
// so session existence never leaks across users.
service StripeService {
    // Create a Stripe Checkout session for a custom dollar amount. The server
    // validates bounds and rejects out-of-range amounts with InvalidArgument
    // before calling Stripe. `request_nonce` drives the Stripe idempotency
    // key so retried gRPC calls collapse into a single Stripe session.
    rpc CreateCheckoutSession(CreateCheckoutSessionRequest)
        returns (CreateCheckoutSessionResponse);

    // Fetch a single session owned by the caller. NotFound covers both
    // "session does not exist" and "session exists but belongs to another
    // user" — callers cannot use this RPC to probe tenant membership.
    rpc GetSessionStatus(GetSessionStatusRequest)
        returns (GetSessionStatusResponse);

    // List sessions owned by the caller, newest first. `limit` caps the
    // result set; the server substitutes a sane default when zero.
    rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
}

// Lifecycle state of a checkout session. Only two transitions exist in v1:
// `PENDING -> COMPLETED` (credit grant fires) and `PENDING -> EXPIRED`.
enum SessionStatus {
    SESSION_STATUS_UNSPECIFIED = 0;
    SESSION_STATUS_PENDING = 1;
    SESSION_STATUS_COMPLETED = 2;
    SESSION_STATUS_EXPIRED = 3;
}

message CreateCheckoutSessionRequest {
    // Authenticated user id populated by basilica-api from the bearer/JWT.
    string caller_user_id = 1;
    // Amount in cents to charge. Server-validated against configured
    // min/max bounds; out-of-range values return InvalidArgument.
    int64 amount_cents = 2;
    string success_url = 3;
    string cancel_url = 4;
    // Client-generated nonce. basilica-stripe derives the Stripe
    // idempotency key from this, so retries collapse on Stripe's side.
    string request_nonce = 5;
}

message CreateCheckoutSessionResponse {
    string session_id = 1;
    string checkout_url = 2;
    int64 requested_amount_cents = 3;
    SessionStatus status = 4;
}

message GetSessionStatusRequest {
    string caller_user_id = 1;
    string session_id = 2;
}

message GetSessionStatusResponse {
    SessionSummary session = 1;
}

message ListSessionsRequest {
    string caller_user_id = 1;
    // Optional cap on returned rows. Server uses a sensible default when zero.
    int32 limit = 2;
}

message ListSessionsResponse {
    repeated SessionSummary sessions = 1;
}

message SessionSummary {
    string session_id = 1;
    SessionStatus status = 2;
    int64 requested_amount_cents = 3;
    // Populated from Stripe's `amount_total` on `checkout.session.completed`;
    // null while the session is still pending.
    optional int64 paid_amount_cents = 4;
    string checkout_url = 5;
    google.protobuf.Timestamp created_at = 6;
    optional google.protobuf.Timestamp completed_at = 7;
    google.protobuf.Timestamp expires_at = 8;
}
