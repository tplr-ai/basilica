syntax = "proto3";

package basilica.stripe.v1;

import "google/protobuf/timestamp.proto";

// StripeService owns Stripe Checkout session creation and status lookups for
// the Basilica credit-purchase flow. The service is VPC-internal only —
// basilica-api authenticates the caller and forwards `caller_user_id` on
// every request; basilica-stripe enforces per-user scoping in SQL on read
// paths and returns NotFound (not PermissionDenied) for cross-tenant lookups
// so session existence never leaks across users.
service StripeService {
    // Create a Stripe Checkout session. The buyer enters the dollar amount
    // on the Stripe-hosted checkout page (backed by a Price with
    // `custom_unit_amount.enabled = true`), so no amount is passed in.
    // `request_nonce` drives the Stripe idempotency key so retried gRPC
    // calls collapse into a single Stripe session. Return URLs
    // (`success_url` / `cancel_url`) are sourced from basilica-stripe's own
    // config — they are a global Basilica property, not caller-controlled,
    // so this RPC does not accept them.
    rpc CreateCheckoutSession(CreateCheckoutSessionRequest)
        returns (CreateCheckoutSessionResponse);

    // Fetch a single session owned by the caller. NotFound covers both
    // "session does not exist" and "session exists but belongs to another
    // user" — callers cannot use this RPC to probe tenant membership.
    rpc GetSessionStatus(GetSessionStatusRequest)
        returns (GetSessionStatusResponse);

    // List sessions owned by the caller, newest first. `limit` caps the
    // result set; the server substitutes a sane default when zero.
    rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
}

// Lifecycle state of a checkout session. Only two transitions exist in v1:
// `PENDING -> COMPLETED` (credit grant fires) and `PENDING -> EXPIRED`.
enum SessionStatus {
    SESSION_STATUS_UNSPECIFIED = 0;
    SESSION_STATUS_PENDING = 1;
    SESSION_STATUS_COMPLETED = 2;
    SESSION_STATUS_EXPIRED = 3;
}

message CreateCheckoutSessionRequest {
    // Authenticated user id populated by basilica-api from the bearer/JWT.
    string caller_user_id = 1;
    reserved 2;
    reserved "amount_cents";
    // Client-generated nonce. basilica-stripe derives the Stripe
    // idempotency key from this, so retries collapse on Stripe's side.
    string request_nonce = 3;
}

message CreateCheckoutSessionResponse {
    string session_id = 1;
    string checkout_url = 2;
    reserved 3;
    reserved "requested_amount_cents";
    SessionStatus status = 4;
}

message GetSessionStatusRequest {
    string caller_user_id = 1;
    string session_id = 2;
}

message GetSessionStatusResponse {
    SessionSummary session = 1;
}

message ListSessionsRequest {
    string caller_user_id = 1;
    // Optional cap on returned rows. Server uses a sensible default when zero.
    int32 limit = 2;
    // Number of rows to skip before applying `limit`, for offset-based
    // pagination. Negative values are treated as zero.
    int32 offset = 3;
    // Optional lifecycle filter. Omit or send `SESSION_STATUS_UNSPECIFIED`
    // to return sessions in every state; otherwise only sessions matching
    // the supplied status are returned.
    optional SessionStatus status = 4;
}

message ListSessionsResponse {
    repeated SessionSummary sessions = 1;
}

message SessionSummary {
    string session_id = 1;
    SessionStatus status = 2;
    reserved 3;
    reserved "requested_amount_cents";
    // Populated from Stripe's `amount_total` on `checkout.session.completed`;
    // null while the session is still pending — the buyer chooses the amount
    // on the hosted checkout page, so nothing is known at creation time.
    optional int64 paid_amount_cents = 4;
    string checkout_url = 5;
    google.protobuf.Timestamp created_at = 6;
    optional google.protobuf.Timestamp completed_at = 7;
    google.protobuf.Timestamp expires_at = 8;

    // Stripe-hosted payment receipt URL. Populated from the PaymentIntent's
    // latest charge on `charge.succeeded`; always available once a session
    // completes, regardless of whether `invoice_creation` was enabled.
    optional string receipt_url = 9;

    // Stripe Invoice id (`in_...`). Populated when basilica-stripe is
    // configured with `[stripe.invoice_creation]`; absent otherwise.
    optional string invoice_id = 10;

    // Human-readable invoice number (e.g. `INV-0001`). Populated on
    // `invoice.finalized`.
    optional string invoice_number = 11;

    // Stripe-hosted invoice page URL. Populated on `invoice.finalized`.
    optional string hosted_invoice_url = 12;

    // Direct URL to the invoice PDF. Populated on `invoice.finalized`.
    optional string invoice_pdf = 13;
}
