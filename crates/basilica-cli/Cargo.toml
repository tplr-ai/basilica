[package]
name = "basilica-cli"
version = "0.10.1"
edition = "2021"
authors = ["Basilica Team <team@basilica.ai>"]
description = "Unified CLI for Basilica GPU rental and network management"
license = "MIT"
repository = "https://github.com/one-covenant/basilica"
homepage = "https://basilica.ai"
documentation = "https://docs.rs/basilica-cli"
readme = "README.md"
keywords = ["bittensor", "cli", "gpu", "compute", "rental"]
categories = ["command-line-utilities", "network-programming"]
rust-version = "1.70"
include = ["src/**/*", "README.md", "LICENSE", "CHANGELOG.md"]

[[bin]]
name = "basilica"
path = "src/main.rs"

[dependencies]
# Workspace dependencies
tokio = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
clap = { workspace = true }
clap-verbosity-flag = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
rust_decimal = { workspace = true }
semver = { workspace = true }

# HTTP client for API communication
reqwest = { workspace = true }
futures = { workspace = true }
futures-util = { workspace = true }
eventsource-stream = { workspace = true }

# Terminal UI and interaction
dialoguer = { workspace = true }
indicatif = { workspace = true }
console = { workspace = true }
tabled = { workspace = true }

# Shell completions
clap_complete = { workspace = true }

# File operations
shellexpand = { workspace = true }
etcetera = { workspace = true }

# Error handling
color-eyre = { workspace = true }

# OAuth dependencies
oauth2 = { workspace = true }
axum = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
webbrowser = { workspace = true }
url = { workspace = true }

# Self-update
self_update = { workspace = true }

# SSH key parsing
ssh-key = { workspace = true }

# Pattern matching
regex = { workspace = true }

# Internal crate dependencies
basilica-aggregator = { version = "0.1", path = "../basilica-aggregator" }
basilica-api = { version = "0.1", path = "../basilica-api" }
basilica-common = { version = "0.1", path = "../basilica-common" }
basilica-sdk = { version = "0.10", path = "../basilica-sdk" }
basilica-validator = { version = "0.1", path = "../basilica-validator", features = ["client", "cli"] }

[dev-dependencies]
