[package]
name = "basilica-sdk"
version = "0.10.0"
edition = "2021"
authors = ["Basilica Team <team@basilica.ai>"]
description = "Official Rust SDK for interacting with the Basilica GPU rental network"
license = "MIT"
repository = "https://github.com/one-covenant/basilica"
homepage = "https://basilica.ai"
documentation = "https://docs.rs/basilica-sdk"
readme = "README.md"
keywords = ["bittensor", "gpu", "compute", "sdk", "api-client"]
categories = ["api-bindings", "asynchronous", "network-programming"]
rust-version = "1.70"
include = ["src/**/*", "README.md", "LICENSE", "CHANGELOG.md"]

[dependencies]
# HTTP client
reqwest = { workspace = true }

# Async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }
chrono = { workspace = true }


# Auth dependencies (moved from CLI)
oauth2 = { workspace = true }
base64 = { workspace = true }
etcetera = { workspace = true }

# Internal dependencies
basilica-common = { version = "0.1", path = "../basilica-common" }
basilica-validator = { version = "0.1", path = "../basilica-validator", features = ["client"] }
basilica-aggregator = { version = "0.1", path = "../basilica-aggregator" }
urlencoding = { workspace = true }

[dev-dependencies]
wiremock = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }

[features]
default = []
client = []
