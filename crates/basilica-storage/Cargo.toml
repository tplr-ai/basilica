[package]
name = "basilica-storage"
version = "0.1.0"
edition = "2021"
authors = ["Basilica Team <team@basilica.ai>"]
description = "Storage daemon for Basilica GPU workloads with R2/S3 and FUSE support"
license = "MIT"
repository = "https://github.com/one-covenant/basilica"
homepage = "https://basilica.ai"
documentation = "https://docs.rs/basilica-storage"
readme = "README.md"
keywords = ["storage", "fuse", "s3", "gpu", "compute"]
categories = ["filesystem", "network-programming", "asynchronous"]
rust-version = "1.70"
include = ["src/**/*", "README.md", "LICENSE", "CHANGELOG.md"]

[[bin]]
name = "basilica-storage-daemon"
path = "src/bin/daemon.rs"
required-features = ["fuse"]

[features]
default = ["fuse"]
fuse = ["dep:fuser"]

[dependencies]
# Workspace dependencies
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
parking_lot = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }

# Object storage - AWS SDK for R2 compatibility
aws-config = "1.1"
aws-sdk-s3 = "1.15"
aws-smithy-runtime-api = "1.1"
bytes = "1.5"

# FUSE filesystem (optional, requires system libfuse3-dev)
fuser = { version = "0.14", optional = true }
libc = { workspace = true }

# Async utilities
async-trait = { workspace = true }
futures = { workspace = true }
tokio-util = { workspace = true }

# Concurrent data structures
dashmap = "5.5"

# Rate limiting and quotas
governor = "0.6"

# Kubernetes API (for daemon mode credential fetching and namespace watching)
kube = { version = "0.88", features = ["derive", "rustls-tls", "runtime"] }
k8s-openapi = { version = "0.21", features = ["v1_29"] }

# CLI
clap = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros"] }
