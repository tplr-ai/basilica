# Sandbox Test API Deployment for K3d Testing
#
# Uses sandbox-test-api: a lightweight control-plane-only API that serves
# /health and /sandboxes endpoints using in-cluster K8s config.
# No Bittensor, database, billing, or auth dependencies.
#
# This is a minimal deployment for local E2E testing only.
# Production deployments use the full basilica-api with Ansible/Helm charts.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: basilica-api
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: basilica-api
rules:
# BasilicaSandbox CRD management (control-plane only)
- apiGroups: ["basilica.ai"]
  resources: ["basilicasandboxes", "basilicasandboxes/status"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# Pod read access (for status only, not exec)
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
# Namespace management for sandbox tenants
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list", "watch", "create"]
# Secret management for exec-agent secrets
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: basilica-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: basilica-api
subjects:
- kind: ServiceAccount
  name: basilica-api
  namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: basilica-api
  namespace: default
  labels:
    app: basilica-api
    app.kubernetes.io/name: basilica-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: basilica-api
  template:
    metadata:
      labels:
        app: basilica-api
        app.kubernetes.io/name: basilica-api
    spec:
      serviceAccountName: basilica-api
      containers:
      - name: api
        image: k3d-basilica-registry:5050/basilica-api:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: RUST_LOG
          value: "info,basilica_sandbox_operator=debug"
        - name: RUST_BACKTRACE
          value: "1"
        - name: PORT
          value: "8080"
        - name: SANDBOX_EXTRA_ALLOWED_IMAGES
          value: "basilica/sandbox-python:latest,python:3.11-slim,k3d-basilica-registry:5050/basilica-exec-agent:latest"
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 10
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: basilica-api
  namespace: default
  labels:
    app: basilica-api
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  selector:
    app: basilica-api
---
# Ingress for external access via K3d load balancer.
# Routes /sandboxes and /health directly to the API service.
# The API registers handlers at /sandboxes (not /api/v1/sandboxes).
# No path prefix rewriting needed — requests arrive at the backend as-is.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: basilica-api
  namespace: default
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  rules:
  - http:
      paths:
      - path: /sandboxes
        pathType: Prefix
        backend:
          service:
            name: basilica-api
            port:
              number: 80
      - path: /health
        pathType: Prefix
        backend:
          service:
            name: basilica-api
            port:
              number: 80
