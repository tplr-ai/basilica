# Basilica Sandbox Operator Deployment for K3d Testing
#
# Deploys basilica-sandbox-operator (separate from basilica-operator).
# This is a minimal deployment for local testing.
# Production deployments should use the Ansible/Helm charts.

apiVersion: v1
kind: Namespace
metadata:
  name: basilica-sandbox-system
  labels:
    app.kubernetes.io/name: basilica
    app.kubernetes.io/component: system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: basilica-sandbox-operator
  namespace: basilica-sandbox-system
  labels:
    app.kubernetes.io/name: basilica-sandbox-operator
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox-operator-webhook
  namespace: basilica-sandbox-system
  labels:
    app: basilica-sandbox-operator
    app.kubernetes.io/name: basilica-sandbox-operator
spec:
  type: ClusterIP
  selector:
    app: basilica-sandbox-operator
  ports:
  - name: webhook
    port: 9443
    targetPort: 9443
    protocol: TCP
---
# ClusterRole for sandbox operator to manage sandbox resources
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: basilica-sandbox-operator
rules:
# BasilicaSandbox and BasilicaWarmPool CRD management
- apiGroups: ["basilica.ai"]
  resources: ["basilicasandboxes", "basilicasandboxes/status", "basilicawarmpools", "basilicawarmpools/status"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# Pod management for sandbox pods
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# Service management for sandbox services
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# Secret management for exec-agent secrets (C1: secrets in K8s Secrets, not CRD status)
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# Namespace management for tenant namespaces (u-{user_id})
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
# Events
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
# Network policies for sandbox isolation
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# ResourceQuota and LimitRange for tenant namespaces
- apiGroups: [""]
  resources: ["resourcequotas", "limitranges"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: basilica-sandbox-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: basilica-sandbox-operator
subjects:
- kind: ServiceAccount
  name: basilica-sandbox-operator
  namespace: basilica-sandbox-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: basilica-sandbox-operator
  namespace: basilica-sandbox-system
  labels:
    app: basilica-sandbox-operator
    app.kubernetes.io/name: basilica-sandbox-operator
    app.kubernetes.io/component: sandbox-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: basilica-sandbox-operator
  template:
    metadata:
      labels:
        app: basilica-sandbox-operator
        app.kubernetes.io/name: basilica-sandbox-operator
    spec:
      serviceAccountName: basilica-sandbox-operator
      containers:
      - name: operator
        image: k3d-basilica-registry:5050/basilica-sandbox-operator:latest
        imagePullPolicy: Always
        args:
        - "--exec-agent-image"
        - "k3d-basilica-registry:5050/basilica-exec-agent:latest"
        env:
        - name: RUST_LOG
          value: "info,basilica_sandbox_operator=debug"
        - name: RUST_BACKTRACE
          value: "1"
        - name: SANDBOX_EXTRA_ALLOWED_IMAGES
          value: "basilica/sandbox-python:latest,python:3.11-slim,k3d-basilica-registry:5050/basilica-exec-agent:latest"
        - name: SANDBOX_WEBHOOK_ADDR
          value: "0.0.0.0:9443"
        - name: SANDBOX_WEBHOOK_TLS_CERT_PATH
          value: "/tls/tls.crt"
        - name: SANDBOX_WEBHOOK_TLS_KEY_PATH
          value: "/tls/tls.key"
        volumeMounts:
        - name: webhook-tls
          mountPath: /tls
          readOnly: true
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 9401
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /ready
            port: 9401
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: webhook-tls
        secret:
          secretName: sandbox-operator-webhook-tls
      terminationGracePeriodSeconds: 30
